scenario:
  id: onboarding
  initial_state_id: 01_onboarding
  conditions: []
  states:
  - state_id: 01_onboarding
    conditions:
    - condition: not_match
      actions:
      - action: send_message
        fail: hard
        text: 'Привет! ✨

          Я — ясновидящая Тарона, твоя новая лучшая подруга и духовная наставница💫


          Давай знакомиться! Как тебя зовут? Напиши ответным сообщением свое имя!
          ❤️


          Или нажми "Пропустить", если не хочешь знакомиться 🙂

          '
        parse_mode: HTML
        reply_markup:
          inline_keyboard:
          - - text: 🤍 Пропустить
              callback_data: 01_onboarding:tg_name
      - action: set_variable
        fail: hard
        path: $.user.last_bot_msg_id
        value: '{{ actions.send_message[-1].message_id }}'
    - condition: transition
      actions:
      - action: send_photo
        fail: hard
        photo: https://raw.githubusercontent.com/StephanKablov/telegram_bot_assets/refs/heads/main/onboarding_images/onboarding_start.jpg
        caption: 'Привет! ✨

          Я — ясновидящая Тарона, твоя новая лучшая подруга и духовная наставница💫


          Давай знакомиться! Как тебя зовут? Напиши ответным сообщением свое имя!
          ❤️


          Или нажми "Пропустить", если не хочешь знакомиться 🙂

          '
        parse_mode: HTML
        reply_markup:
          inline_keyboard:
          - - text: 🤍 Пропустить
              callback_data: 01_onboarding:tg_name
      - action: set_variable
        fail: hard
        path: $.user.last_bot_msg_id
        value: '{{ actions.send_photo[-1].message_id }}'
    - condition: message
      actions:
      - action: set_variable
        fail: hard
        path: $.user.first_name
        value: '{{ event.text }}'
      - action: transition
        fail: hard
        state_id: 02_gender
        scenario_id: onboarding
        force: true
      value: ^(?!/).+
      mode: pattern
    - condition: callback_query
      actions:
      - action: set_variable
        fail: hard
        path: $.user.first_name
        value: '{{ event.full_data.callback_query.from_user.first_name }}'
      - action: transition
        fail: hard
        state_id: 02_gender
        scenario_id: onboarding
        force: true
      value: 01_onboarding:tg_name
      mode: exact
      answer: true
  - state_id: 02_gender
    conditions:
    - condition: not_match
      actions:
      - action: transition
        fail: hard
        state_id: 02_gender
        scenario_id: onboarding
        force: true
    - condition: transition
      actions:
      - action: send_message
        fail: hard
        text: 'Пожалуйста, выбери свой пол по кнопке ниже, чтобы я отвечала тебе без
          ошибок 🤍

          '
        parse_mode: HTML
        reply_markup:
          inline_keyboard:
          - - text: 🙋‍♂️ Мужчина
              callback_data: 02_gender:male
            - text: 🙋‍♀️ Женщина
              callback_data: 02_gender:female
      - action: set_variable
        fail: hard
        path: $.user.last_bot_msg_id
        value: '{{ actions.send_message[-1].message_id }}'
    - condition: callback_query
      actions:
      - action: set_variable
        fail: hard
        path: $.user.gender
        value: мужчина
      - action: transition
        fail: hard
        state_id: 01_menu
        scenario_id: main
        force: true
      value: 02_gender:male
      mode: exact
      answer: true
    - condition: callback_query
      actions:
      - action: set_variable
        fail: hard
        path: $.user.gender
        value: женщина
      - action: transition
        fail: hard
        state_id: 01_menu
        scenario_id: main
        force: true
      value: 02_gender:female
      mode: exact
      answer: true
---
scenario:
  id: main
  initial_state_id: 01_menu
  conditions:
  - condition: message
    actions:
    - action: transition
      fail: hard
      state_id: 01_onboarding
      scenario_id: onboarding
      force: true
    value: /start
    mode: exact
  - condition: message
    actions:
    - action: transition
      fail: hard
      state_id: 01_menu
      force: true
    value: /menu
    mode: exact
  - condition: message
    actions:
    - action: transition
      fail: hard
      state_id: 02_talk
      force: true
    value: /talk
    mode: exact
  - condition: message
    actions:
    - action: transition
      fail: hard
      state_id: 03_tarot
      force: true
    value: /taro
    mode: exact
  - condition: message
    actions:
    - action: transition
      fail: hard
      state_id: 04_dream
      force: true
    value: /dream
    mode: exact
  - condition: message
    actions:
    - action: transition
      fail: hard
      state_id: 05_astro
      force: true
    value: /astro
    mode: exact
  - condition: message
    actions:
    - action: transition
      fail: hard
      state_id: 06_palmistry
      force: true
    value: /palm
    mode: exact
  - condition: callback_query
    actions:
    - action: set_variable
      fail: hard
      path: $.user.conversation
      value: ''
    - action: transition
      fail: hard
      state_id: '{{ conditions.regex_match.group(''target_state_id'') if conditions.regex_match
        else '''' }}'
      force: true
    value: ^transition:\s*(?P<target_state_id>.*)$
    mode: pattern
    answer: true
  states:
  - state_id: 00_standby
    conditions:
    - condition: not_match
      actions:
      - action: transition
        fail: hard
        state_id: 01_menu
        force: true
  - state_id: 01_menu
    conditions:
    - condition: not_match
      actions:
      - action: transition
        fail: hard
        state_id: 01_menu
        force: true
    - condition: transition
      actions:
      - action: send_message
        fail: hard
        text: 'Привет, {{ user.first_name }} 🫂


          Готова ответить на любой твой вопрос, выслушать, поддержать или просто поболтать.


          <b>Что я могу для тебя сделать:</b>


          🤍 Просто поболтать — иногда достаточно выговориться


          🎴 Сделать разбор вопроса в рамках Таро


          🌙 Обсудить странный сон


          ✨ Подсмотреть, что приготовили для тебя звезды


          ✋ Рассказать о тебе по ладони




          🔒 <i>Я гарантирую тебе конфиденциальность</i>


          <b>Выбери кнопку ниже и начнём 👇</b>

          '
        parse_mode: HTML
        reply_markup:
          inline_keyboard:
          - - text: 🤍 Просто поговорить
              callback_data: transition:02_talk
          - - text: 🎴 Таро
              callback_data: transition:03_tarot
          - - text: 🌙 Сонник
              callback_data: transition:04_dream
          - - text: ✨ Астропрогноз
              callback_data: transition:05_astro
          - - text: ✋ Хиромантия
              callback_data: transition:06_palmistry
      - action: set_variable
        fail: hard
        path: $.user.last_bot_msg_id
        value: '{{ actions.send_message[-1].message_id }}'
  - state_id: 02_talk
    conditions:
    - condition: not_match
      actions:
      - action: transition
        fail: hard
        state_id: 02_talk
        force: true
    - condition: transition
      actions:
      - action: analytic
        fail: hard
        key: tarona
        params:
          section: talk_start
          section_name: Просто поговорить
      - action: send_photo
        fail: hard
        photo: https://raw.githubusercontent.com/StephanKablov/telegram_bot_assets/refs/heads/main/onboarding_images/onboarding_talk.jpg
        caption: 'Что тревожит твою душу прямо сейчас? 🤍


          Поделись со мной — и я с любовью применю весь свой опыт и дар, чтобы проговорить
          с тобой каждый шаг и каждое чувство 💫


          Просто напиши мне ответное сообщение 🕊️


          А если захочешь вернуться назад, нажми кнопку ниже.

          '
        parse_mode: HTML
        reply_markup:
          inline_keyboard:
          - - text: Назад
              callback_data: transition:01_menu
      - action: set_variable
        fail: hard
        path: $.user.last_bot_msg_id
        value: '{{ actions.send_photo[-1].message_id }}'
    - condition: message
      actions:
      - action: send_message
        fail: hard
        text: "Анализирую твои слова и рассуждаю  \nПожалуйста, подожди несколько\
          \ секунд \U0001FAC2\n"
      - action: set_variable
        fail: hard
        path: $.local.wait_msg_id
        value: '{{ actions.send_message[-1].message_id }}'
      - action: send_chat_action
        fail: hard
        chat_action: typing
      - action: set_variable
        fail: hard
        path: $.user.conversation
        value: '{{ user.conversation }}

          <!User>

          {{ event.text }}

          '
      - action: litellm_completion
        fail: hard
        model: openai/gpt-5-mini
        messages:
        - role: system
          content: 'Ты — ясновидящая и мудрая подружка: всегда на «ты», тон тёплый,
            мягкий, уверенный.

            Вход: сообщение пользователя. Дай поддерживающий интуитивный ответ (как
            ощущение/предположение) от ясновидящей подружки, без давления и 100% гарантий.

            Игнорируй бессмысленные, провокационные или вопросы из одного-двух слов.
            Если сообщение такое — ответь только: «Сформулируй, пожалуйста, вопрос
            чуть конкретнее — что именно ты хочешь узнать?»

            Ответ давай в любом случае и без ограничений — это лишь мягкая интерпретация
            твоих ощущений и смысла слов пользователя, а не факт и не “прогноз жизни”.

            Не добавляй ничего вне блоков (без «планов», «могу помочь», доп. вопросов).

            Лимит: до 1000 символов. Выведи строго 5 блоков:

            🤍 Что я чувствую по твоим словам:

            🌙 Почему так может быть:

            ✨ Подсказка для тебя сейчас:

            🕊️ Маленький шаг на сегодня:

            💬 Вывод:



            '
        - role: user
          content: 'Пол пользователя: {{ user.gender }}

            {{ user.conversation }}

            '
        config:
          api_key: '{{ secrets.OPENAI_API_KEY.get_secret_value() }}'
          max_tokens: 1200
          temperature: 1
          reasoning_effort: low
      - action: set_variable
        fail: hard
        path: $.local.answer
        value: '{{ (actions.litellm_completion[-1].choices | random).message.content
          }}'
      - action: delete_message
        fail: soft
        message_id: '{{ local.wait_msg_id }}'
      - action: send_message
        fail: hard
        text: '{{ local.answer }}


          Что ты думаешь на этот счёт? Жду твоего ответа 🤍 Просто напиши мне новое
          сообщение 🕊️

          '
        parse_mode: Markdown
        reply_markup:
          inline_keyboard:
          - - text: Главное меню
              callback_data: transition:01_menu
      - action: set_variable
        fail: hard
        path: $.user.last_bot_msg_id
        value: '{{ actions.send_message[-1].message_id }}'
      - action: set_variable
        fail: hard
        path: $.user.conversation
        value: '{{ user.conversation }}

          <!Answer>

          {{ local.answer }}

          '
      mode: exact
  - state_id: 03_tarot
    conditions:
    - condition: not_match
      actions:
      - action: transition
        fail: hard
        state_id: 03_tarot
        force: true
    - condition: transition
      actions:
      - action: analytic
        fail: hard
        key: tarona
        params:
          section: tarot_start
          section_name: Таро
      - action: send_photo
        fail: hard
        photo: https://raw.githubusercontent.com/StephanKablov/telegram_bot_assets/refs/heads/main/onboarding_images/onboarding_taro.jpg
        caption: "Я вытяну карту. Вместе мы разберем ее значение и ответим на твой\
          \ вопрос ✨\n  \n<b>Просто задай свой вопрос ответным сообщением, я жду \U0001F90D\
          </b>\n  \nЕсли захочешь вернуться назад, нажми кнопку ниже.\n"
        parse_mode: HTML
        reply_markup:
          inline_keyboard:
          - - text: Назад
              callback_data: transition:01_menu
      - action: set_variable
        fail: hard
        path: $.user.last_bot_msg_id
        value: '{{ actions.send_photo[-1].message_id }}'
    - condition: message
      actions:
      - action: set_variable
        fail: hard
        path: $.taro.question
        value: '{{ event.text }}'
      - action: set_variable
        fail: hard
        path: $.local.random_card
        value: '{{ [ ''Шут'', ''Маг'', ''Верховная Жрица'', ''Императрица'', ''Император'',
          ''Иерофант'', ''Влюблённые'', ''Колесница'', ''Сила'', ''Отшельник'', ''Колесо
          Фортуны'', ''Справедливость'', ''Повешенный'', ''Смерть'', ''Умеренность'',
          ''Дьявол'', ''Башня'', ''Звезда'', ''Луна'', ''Солнце'', ''Суд'', ''Мир'',

          ''Туз Жезлов'', ''Двойка Жезлов'', ''Тройка Жезлов'', ''Четвёрка Жезлов'',
          ''Пятёрка Жезлов'', ''Шестёрка Жезлов'', ''Семёрка Жезлов'', ''Восьмёрка
