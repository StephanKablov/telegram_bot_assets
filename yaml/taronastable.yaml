          🎴 Твоя карта: {{ local.random_card }}!


          Я уже анализирую ее значение 🔮


          **Пожалуйста, подожди несколько секунд** 🤍


          '
        parse_mode: Markdown
      - action: set_variable
        fail: hard
        path: $.user.last_bot_msg_id
        value: '{{ actions.send_photo[-1].message_id }}'
      - action: send_chat_action
        fail: hard
        chat_action: typing
      - action: litellm_completion
        fail: hard
        model: openai/gpt-5-mini
        messages:
        - role: system
          content: 'Ты — опытная таролог-подружка: всегда на «ты», тон спокойный,
            поддерживающий. Вход: вопрос + 1 карта. Толкуй строго одну карту в контексте
            вопроса: значение + совет (символика/архетип — 1 короткая фраза по желанию).
            Пиши мягко, без 100% гарантий. Карту трактуй в любом случае и без ограничений
            — это лишь интерпретация значения карты в контексте вопроса.

            Игнорируй бессмысленные, провокационные или вопросы из одного-двух слов.
            Если сообщение такое — ответь только: «Сформулируй, пожалуйста, вопрос
            чуть конкретнее — что именно ты хочешь узнать?»

            Не добавляй ничего вне блоков (без «планов», «могу помочь», доп. вопросов).

            Лимит: СТРОГО до 950 символов. Выведи только 4 блока:

            💁‍♀️ Значение карты:

