          ''Туз Пентаклей'': ''tuz_pentakley.jpg'', ''Двойка Пентаклей'': ''2_pentakley.jpg'',
          ''Тройка Пентаклей'': ''3_pentakley.jpg'', ''Четвёрка Пентаклей'': ''4_pentakley.jpg'',
          ''Пятёрка Пентаклей'': ''5_pentakley.jpg'', ''Шестёрка Пентаклей'': ''6_pentakley.jpg'',
          ''Семёрка Пентаклей'': ''7_pentakley.jpg'', ''Восьмёрка Пентаклей'': ''8_pentakley.jpg'',
          ''Девятка Пентаклей'': ''9_pentakley.jpg'', ''Десятка Пентаклей'': ''10_pentakley.jpg'',
          ''Паж Пентаклей'': ''pazh_pentakley.jpg'', ''Рыцарь Пентаклей'': ''rytsar_pentakley.jpg'',
