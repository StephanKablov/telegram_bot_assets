          Пентаклей'', ''Рыцарь Пентаклей'', ''Королева Пентаклей'', ''Король Пентаклей''
          ] | random }}'
      - action: set_variable
        fail: hard
        path: $.local.random_card_file_id
        value: '{{ ''https://raw.githubusercontent.com/StephanKablov/telegram_bot_assets/refs/heads/main/tarot_cards/''
          ~ ({ ''Шут'': ''durak.jpg'', ''Маг'': ''mag.jpg'', ''Верховная Жрица'':
          ''verkhovnaya_zhritsa.jpg'', ''Императрица'': ''imperatritsa.jpg'', ''Император'':
